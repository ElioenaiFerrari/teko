teko-economy.workspace = true
teko-crypto.workspace = true
teko-ledger.workspace = true
prost.workspace = true
rand.workspace = true

[dev-dependencies]
election-admin = { workspace = true, features = ["operator"] }
teko-election.workspace = true
teko-chain.workspace = true
device-emulator.workspace = true
teko-attestation.workspace = true
teko-client.workspace = true
teko-protocol.workspace = true
teko-registration.workspace = true
teko-transport.workspace = true
teko-device-core = { workspace = true, features = ["testing"] }
p256.workspace = true

