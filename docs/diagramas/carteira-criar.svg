="233" width="175" height="14" rx="2" fill="#F5EFE3"/><text x="670.0" y="243" fill="#4A5C52" font-size="8" font-family="'Geist Mono',ui-monospace,Menlo,monospace" text-anchor="middle" letter-spacing="0.05em">mostra 24 palavras (6 por página)</text><rect x="602" y="269" width="135" height="14" rx="2" fill="#F5EFE3"/><text x="670.0" y="279" fill="#4A5C52" font-size="8" font-family="'Geist Mono',ui-monospace,Menlo,monospace" text-anchor="middle" letter-spacing="0.05em">anota em papel e confirma</text><rect x="602" y="305" width="135" height="14" rx="2" fill="#F5EFE3"/><text x="670.0" y="315" fill="#4A5C52" font-size="8" font-family="'Geist Mono',ui-monospace,Menlo,monospace" text-anchor="middle" letter-spacing="0.05em">pede 3 posições sorteadas</text><rect x="600" y="341" width="140" height="14" rx="2" fill="#F5EFE3"/><text x="670.0" y="351" fill="#4A5C52" font-size="8" font-family="'Geist Mono',ui-monospace,Menlo,monospace" text-anchor="middle" letter-spacing="0.05em">digita as palavras pedidas</text><rect x="315" y="382" width="330" height="26" rx="4" fill="#FFF4CC" stroke="#F2B705" stroke-width="1"/><text x="480" y="398" fill="#1A2B22" font-size="9.5" font-family="'Geist','Avenir Next','Segoe UI',system-ui,sans-serif" text-anchor="middle">Errou? Mostra a frase de novo. Acertou: salva</text><rect x="242" y="417" width="115" height="14" rx="2" fill="#F5EFE3"/><text x="300.0" y="427" fill="#4A5C52" font-size="8" font-family="'Geist Mono',ui-monospace,Menlo,monospace" text-anchor="middle" letter-spacing="0.05em">WalletReady{endereço}</text><rect x="16" y="458" width="260" height="26" rx="4" fill="#FFF4CC" stroke="#F2B705" stroke-width="1"/><text x="146" y="474" fill="#1A2B22" font-size="9.5" font-family="'Geist','Avenir Next','Segoe UI',system-ui,sans-serif" text-anchor="middle">A Suite só recebe o endereço público</text><line x1="32" y1="566" x2="968" y2="566" stroke="#CFC5AE" stroke-width="1"/><line x1="32" y1="582" x2="54" y2="582" stroke="#4A5C52" stroke-width="1.6"