[package]
name = "teko-suite"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Teko Suite: desktop companion for the Teko civic identity device"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost.workspace = true
teko-client.workspace = true
teko-coin.workspace = true
teko-assets.workspace = true
teko-credentials.workspace = true
teko-ledger.workspace = true
teko-node.workspace = true
teko-attestation.workspace = true
teko-protocol.workspace = true
teko-transport.workspace = true
teko-crypto.workspace = true
# Test authority (signs credentials/registrations): DEV ONLY, behind `dev-simulation`.
issuer-cli = { workspace = true, optional = true }
election-admin.workspace = true
teko-bulletin.workspace = true
teko-election.workspace = true
teko-ballot-crypto.workspace = true

[features]
default = ["custom-protocol", "dev-simulation"]
# The Suite plays the AUTHORITY (signs credentials and registrations) and the board
# OPERATOR (publishes, closes contests, simulates voters) using TEST keys in dev/.
# A production build must NOT include this: build with --no-default-features
# --features custom-protocol (scripts/release-check.sh verifies it).
dev-simulation = ["dep:issuer-cli", "election-admin/operator"]
# Serves the embedded UI instead of a dev server (needed for `cargo run`).
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
