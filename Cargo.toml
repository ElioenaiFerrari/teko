[workspace]
resolver = "3"
members = [
  "crates/teko-protocol",
  "crates/teko-crypto",
  "crates/teko-attestation",
  "crates/teko-election",
  "crates/teko-bulletin",
  "crates/teko-registration",
  "crates/teko-chain",
  "crates/teko-device-core",
  "crates/teko-transport",
  "crates/teko-client",
  "tools/device-emulator",
  "tools/issuer-cli",
  "tools/election-admin-cli",
  "tools/teko-node",
  "apps/suite/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
prost = { version = "0.13", default-features = false, features = ["derive"] }
sha3 = { version = "0.10", default-features = false }
p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
bech32 = { version = "0.11", default-features = false, features = ["alloc"] }
zeroize = { version = "1", default-features = false, features = ["alloc", "derive"] }
subtle = { version = "2", default-features = false }
thiserror = { version = "2", default-features = false }
rand_core = { version = "0.10", default-features = false }
rand = "0.10"
proptest = "1"

teko-protocol = { path = "crates/teko-protocol" }
teko-crypto = { path = "crates/teko-crypto" }
teko-device-core = { path = "crates/teko-device-core" }
teko-attestation = { path = "crates/teko-attestation" }
teko-election = { path = "crates/teko-election" }
teko-bulletin = { path = "crates/teko-bulletin" }
teko-registration = { path = "crates/teko-registration" }
teko-chain = { path = "crates/teko-chain" }
teko-transport = { path = "crates/teko-transport" }
teko-client = { path = "crates/teko-client" }
device-emulator = { path = "tools/device-emulator" }
issuer-cli = { path = "tools/issuer-cli" }
teko-node = { path = "tools/teko-node" }
election-admin = { package = "election-admin-cli", path = "tools/election-admin-cli", default-features = false }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
codegen-units = 1
debug = false
strip = true

# Heavy crypto (RSA keygen, P-256) is unusably slow at opt-level 0: optimise
# DEPENDENCIES even in dev/test builds (our own crates stay debuggable).
[profile.dev.package."*"]
opt-level = 2
