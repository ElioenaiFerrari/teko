# CI do Teko. Primeira execução: core, no-std e suite passaram; deny achou 3 itens (tratados).
# Pendente: fixar as actions por SHA (hoje por tag).
name: CI
on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show   # lê rust-toolchain.toml
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude teko-suite --all-targets --locked -- -D warnings
      - run: cargo test --workspace --exclude teko-suite --locked
      - run: ./scripts/docs-check.sh        # documentação viva: links, imagens, crates no README
      - run: ./scripts/release-check.sh     # build normal sem botões automáticos
      - run: ./scripts/repro-build.sh       # build reproduzível (2 diretórios)

  no-std:
    # Prova que o núcleo compila para um alvo embarcado real (sem std).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add thumbv7em-none-eabihf
      - run: >
          cargo build --locked --target thumbv7em-none-eabihf
          -p teko-protocol -p teko-crypto -p teko-attestation -p teko-election -p teko-device-core

  suite:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo clippy -p teko-suite --all-targets --locked -- -D warnings
      # Suite de PRODUÇÃO: sem a autoridade/operador de teste (feature dev-simulation)
      - run: cargo clippy -p teko-suite --no-default-features --features custom-protocol --all-targets --locked -- -D warnings
      - run: cargo build -p teko-suite --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
