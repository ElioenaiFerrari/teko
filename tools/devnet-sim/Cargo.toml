[package]
name = "devnet-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Development-only simulators for the local test network (equivocation penalty). Never part of a validator or a release."

[lib]
name = "devnet_sim"
path = "src/lib.rs"

[[bin]]
name = "devnet-sim"
path = "src/main.rs"

