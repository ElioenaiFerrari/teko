# cargo-deny — supply chain (princípio 4). Roda no CI (não instalado localmente).
# Se a lista de licenças reclamar de alguma dependência, revise e ajuste.
[advisories]
version = 2
yanked = "deny"
ignore = [
  # proc-macro-error: "não mantido" (não é vulnerabilidade); macro de build, vem do Tauri. Reavaliar ao atualizar o Tauri.
  { id = "RUSTSEC-2024-0370", reason = "unmaintained, build-time proc macro via Tauri; sem correção disponível" },
]

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0", "0BSD", "BSL-1.0", "MIT-0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
