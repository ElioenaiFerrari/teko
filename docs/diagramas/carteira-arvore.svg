nt-size="9" font-family="'Geist Mono',ui-monospace,Menlo,monospace" text-anchor="middle">K_root, nunca sai</text><rect x="320" y="380" width="220" height="76" rx="6" fill="#F5EFE3"/><rect x="320" y="380" width="220" height="76" rx="6" fill="#FBE9EF" stroke="#B8365F" stroke-width="1"/><rect x="328" y="386" width="34" height="12" rx="2" fill="none" stroke="#B8365F" stroke-opacity="0.5" stroke-width="0.8"/><text x="345" y="395" fill="#B8365F" font-size="7" font-family="'Geist Mono',ui-monospace,Menlo,monospace" text-anchor="middle" letter-spacing="0.08em">VOTO</text><text x="430.0" y="418" fill="#1A2B22" font-size="12" font-weight="600" font-family="'Geist','Avenir Next','Segoe UI',system-ui,sans-serif" text-anchor="middle">Segredo de eleitor</text><text x="430.0" y="433" fill="#4A5C52" font-size="9" font-family="'Geist Mono',ui-monospace,Menlo,monospace" text-anchor="middle">s, entropia separada</text><text x="600" y="410" fill="#1A2B22" font-size="11" font-weight="600" font-family="'Geist','Avenir Next','Segoe UI',system-ui,sans-serif" text-anchor="start">Nenhuma das duas raízes deriva da frase,</text><text x="600" y="428" fill="#4A5C52" font-size="11" font-weight="400" font-family="'Geist','Avenir Next','Segoe UI',system-ui,sans-serif" text-anchor="start">nem a frase deriva delas: vender ou perder</text><text x="600" y="446" fill="#4A5C52" font-size="11" font-weight="400" font-family="'Geist','Avenir Next','Segoe UI',system-ui,sans-serif" text-anchor="start">a frase não revela quem você é nem seu voto.</text><rect x="492" y="293" width="115" height="14" rx="2" fill="#F5EFE3"/><text x="550" y="303" fill="#C62F24" font-size="8" font-family="'Geist Mono',ui-monospace,Menlo,monospace" text-anchor="middle" letter-spacing="0.05em">sem nenhuma derivação</text><line x1="32" y1="514" x2="1068" y2="514" stroke="#CFC5AE" stroke-width="1"/><line x1="32" y1="530" x2="54" y2="530" stroke="#4A5C52" stroke-width="1.6"/><text x="62" y="534" fill="#4A5C52" font-size="10" font-family=